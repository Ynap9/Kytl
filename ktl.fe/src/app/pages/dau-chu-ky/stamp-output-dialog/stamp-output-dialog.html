<p-dialog
  header="Chèn dấu & chữ ký"
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '34rem' }"
>
  <div class="flex flex-col gap-4">
    <div class="rounded-lg bg-[#f5f7fa] px-4 py-3 text-sm text-slate-600">
      Chèn <span class="font-semibold text-slate-800">{{ stampCount() }}</span> khối dấu/chữ ký vào
      <span class="font-semibold text-slate-800">{{ fileCount() }}</span> file PDF. File gốc được giữ nguyên.
    </div>

    <div class="flex flex-col gap-1.5">
      <span class="text-sm font-semibold text-slate-800">Thư mục lưu</span>
      <app-path-picker
        kind="folder"
        label="thư mục lưu"
        [hint]="hasDropped() ? 'Bắt buộc chọn vì có file kéo thả vào' : 'Để trống = lưu cạnh từng file gốc'"
        [invalid]="needsOutputFolder()"
        [value]="outputFolder()"
        (valueChange)="outputFolder.set($event)"
      />
    </div>

    <label class="flex cursor-pointer items-start gap-2.5 rounded-lg border border-[var(--layout-border)] px-4 py-3">
      <p-checkbox [binary]="true" [ngModel]="signAfter()" (ngModelChange)="signAfter.set($event)" inputId="stamp-sign-after" />
      <span class="flex flex-col">
        <span class="text-sm font-medium text-slate-800">Ký số sau khi chèn</span>
        <span class="text-xs text-slate-500">Chèn xong tự chuyển sang Ký số với các file vừa tạo</span>
      </span>
    </label>

    @if (signedCount() > 0) {
      <div class="flex gap-2.5 rounded-lg bg-amber-50 px-4 py-3 text-sm text-amber-800">
        <i class="pi pi-exclamation-triangle mt-0.5"></i>
        <span>
          Có {{ signedCount() }} file đã ký số. Chèn dấu, chữ ký sẽ ghi lại file nên chữ ký số trong bản mới sẽ mất hiệu lực.
        </span>
      </div>
    }
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Hủy" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
    <p-button label="Bắt đầu" icon="pi pi-play" [disabled]="needsOutputFolder()" (onClick)="confirm()" />
  </ng-template>
</p-dialog>
