<div class="flex min-h-0 flex-1 flex-col gap-4">
  <app-breadcrumb [home]="home" [items]="breadcrumbItems" />

  <h1 class="text-xl font-semibold text-slate-800">Ký số</h1>

  <div class="grid grid-cols-12 gap-4">
    <div class="col-span-7 min-w-0 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <app-pdf-source-picker title="File, thư mục cần ký" [droppable]="false" [(sources)]="sources" />
    </div>

    <div class="col-span-5 flex min-w-0 flex-col gap-4 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <h2 class="flex items-center gap-2 text-base font-semibold text-slate-800">
        <i class="pi pi-verified text-primary"></i>
        Cấu hình chữ ký
      </h2>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-slate-700">Chứng thư số</label>
        <div class="flex items-center gap-2">
          <p-select
            [options]="certs()"
            [ngModel]="thumbprint()"
            optionLabel="commonName"
            optionValue="thumbprint"
            [filter]="true"
            filterBy="commonName,serialNumber,issuerCommonName"
            [loading]="certLoading()"
            [placeholder]="certName() || 'Chọn chứng thư số'"
            class="min-w-0 flex-1"
            (onChange)="onCertChange($event.value)"
          />
          <p-button
            label="Xác thực PIN"
            icon="pi pi-key"
            [outlined]="true"
            [disabled]="!thumbprint()"
            [loading]="verifying()"
            (onClick)="verify()"
          />
        </div>
        @if (isVerified()) {
          <p-tag severity="success" icon="pi pi-check-circle" value="Đã xác thực" class="self-start" />
        }
      </div>

      <p-divider styleClass="my-0" />

      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2">
          <label class="text-sm font-medium text-slate-700">Hiển thị chữ ký</label>
          <p-button
            label="Cấu hình"
            icon="pi pi-sliders-h"
            size="small"
            [outlined]="true"
            (onClick)="showConfig.set(true)"
          />
        </div>
        <div class="flex flex-wrap gap-1.5">
          @for (item of configSummary(); track item) {
            <span class="rounded-full bg-slate-100 px-2.5 py-0.5 text-xs text-slate-600">{{ item }}</span>
          }
        </div>
      </div>
    </div>
  </div>

  @if (!thumbprint()) {
    <p-message severity="info" text="Chọn chứng thư số để bắt đầu." />
  } @else if (sources().length === 0) {
    <p-message severity="info" text="Chọn file hoặc thư mục cần ký." />
  } @else {
    <app-sign-step
      [thumbprint]="thumbprint() ?? ''"
      [certName]="certName()"
      [sources]="sources()"
      [config]="config()"
    />
  }

  <app-sign-config-dialog
    [(visible)]="showConfig"
    [sources]="sources()"
    [certName]="certName()"
    [config]="config()"
    (save)="onConfigSave($event)"
  />
</div>
