<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [showHeader]="false"
  [style]="{ width: '32rem' }"
  styleClass="sign-result-dialog"
>
  @if (result(); as r) {
    @let s = status();
    <div class="srd-card" [attr.data-tone]="s.tone">
      <button type="button" class="srd-dismiss" aria-label="Đóng" (click)="onClose()">
        <i class="pi pi-times"></i>
      </button>

      <div class="srd-hero">
        <div class="srd-badge">
          <span class="srd-badge__ring"></span>
          <i class="pi" [ngClass]="s.icon"></i>
        </div>
        <h2 class="srd-title">{{ s.title }}</h2>
      </div>

      <div class="srd-body">
        <div class="srd-stats">
          <div class="srd-stat srd-stat--green">
            <span class="srd-stat__value">{{ r.successCount }}</span>
            <span class="srd-stat__label">Đã ký</span>
            <span class="srd-stat__hint">/ {{ r.totalFiles }} file</span>
          </div>
          <div class="srd-stat srd-stat--red" [class.srd-stat--muted]="r.failedCount === 0">
            <span class="srd-stat__value">{{ r.failedCount }}</span>
            <span class="srd-stat__label">Lỗi</span>
          </div>
        </div>

        <div class="srd-path">
          <span class="srd-path__icon"><i class="pi pi-folder"></i></span>
          <div class="srd-path__text">
            <span class="srd-path__label">Thư mục lưu</span>
            <span class="srd-path__value" [title]="r.outputFolder">{{ r.outputFolder || 'Cạnh từng file gốc' }}</span>
          </div>
        </div>
      </div>

      <div class="srd-footer">
        <p-button label="Đóng" severity="secondary" [text]="true" (onClick)="onClose()" />
        @if (r.outputFolder) {
          <p-button label="Mở thư mục" icon="pi pi-folder-open" (onClick)="onOpenFolder()" />
        }
      </div>
    </div>
  }
</p-dialog>
